[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.115.0",
    "fastembed>=0.9.0",
    "google-genai>=2.28.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.5.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
