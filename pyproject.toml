[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=1.8.0",
    "fastapi>=0.115.0",
    "fastembed>=0.9.0",
    "google-genai>=2.28.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=5.0.4",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "opentelemetry-instrumentation-anthropic>=0.62.4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.5.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.6",
    "sqlglot>=30.24.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/prompts/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app layers"
type = "layers"
layers = [
    "app.api | app.evaluation",
    "app.agent",
    "app.rag | app.ingestion",
    "app.db | app.embeddings",
    "app.domain | app.prompts",
    "app.core",
]
